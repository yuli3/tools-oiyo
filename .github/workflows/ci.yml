name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - name: shadcn lint
        run: npm run lint:shadcn
      - name: kr-rates parity + vectors
        run: npm test
      - run: npm run build
      - name: Loan comparison six-locale HTML
        run: npm run test:loan-comparison-html
