name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run type-check
      - name: shadcn lint
        run: npm run lint:shadcn
      - name: kr-rates parity + vectors
        run: npm test
      - name: Korean 2027 comparison regression
        run: node --experimental-strip-types --test src/lib/kr-2027-comparison.test.ts
      - name: Quartile convention and parser regression
        run: node --experimental-strip-types --test src/lib/quartile.test.ts
      - run: npm run build
      - name: Authored output regression
        run: node --test scripts/manual-ads-html.test.mjs
      - name: Quartile six-locale HTML
        run: node --test scripts/quartile-html.test.mjs
      - name: Loan comparison six-locale HTML
        run: npm run test:loan-comparison-html
      - name: Native-language labor tools and discovery
        run: npm run test:country-labor-html
      - name: Regional labor scope and native discovery
        run: npm run test:regional-labor-html
